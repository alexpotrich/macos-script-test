name: Test modification fichiers macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 10

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Vérifier les données originales
        run: |
          echo "===== DONNEES ORIGINALES ====="
          find "$GITHUB_WORKSPACE/test-data" -type f -print

      - name: Créer une copie de travail
        run: |
          cp -R "$GITHUB_WORKSPACE/test-data" \
                "$GITHUB_WORKSPACE/work-data"

          echo "Copie créée."
          find "$GITHUB_WORKSPACE/work-data" -type f -print

      - name: Calculer les hashes AVANT
        run: |
          cd "$GITHUB_WORKSPACE/work-data"

          find . -type f -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 \
            > "$GITHUB_WORKSPACE/before.sha256"

          echo "===== HASHES AVANT ====="
          cat "$GITHUB_WORKSPACE/before.sha256"

      - name: Exécuter le script
        run: |
          chmod +x "$GITHUB_WORKSPACE/test.sh"

          "$GITHUB_WORKSPACE/test.sh" \
            "$GITHUB_WORKSPACE/work-data"

      - name: Calculer les hashes APRES
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/work-data"

          find . -type f -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 \
            > "$GITHUB_WORKSPACE/after.sha256"

          echo "===== HASHES APRES ====="
          cat "$GITHUB_WORKSPACE/after.sha256"

      - name: Comparer avant et après
        if: always()
        run: |
          echo "===== DIFFERENCES ====="

          diff -u \
            "$GITHUB_WORKSPACE/before.sha256" \
            "$GITHUB_WORKSPACE/after.sha256" \
            || true

      - name: Informations sur les fichiers après test
        if: always()
        run: |
          echo "===== FICHIERS APRES TEST ====="

          find "$GITHUB_WORKSPACE/work-data" \
            -type f \
            -exec file {} \;

      - name: Sauvegarder les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fichiers-apres-test
          path: |
            work-data/
            before.sha256
            after.sha256
          retention-days: 1
