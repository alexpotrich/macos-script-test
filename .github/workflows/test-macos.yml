name: Test modification fichiers macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:

    runs-on: macos-26
    timeout-minutes: 20

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v6
        with:
          persist-credentials: false


      - name: Installer les outils de validation
        run: |
          python3 -m venv "$GITHUB_WORKSPACE/validator-env"
          source "$GITHUB_WORKSPACE/validator-env/bin/activate"

          pip install --upgrade pip
          pip install pillow pypdf

          if ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi


      - name: Créer une copie de travail
        run: |
          cp -R "$GITHUB_WORKSPACE/test-data" \
                "$GITHUB_WORKSPACE/work-data"


      - name: Calculer les hashes AVANT
        run: |
          cd "$GITHUB_WORKSPACE/work-data"

          find . -type f -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 \
            > "$GITHUB_WORKSPACE/before.sha256"

          cat "$GITHUB_WORKSPACE/before.sha256"

      - name: Protéger test1/texte.txt
        run: |
          sudo chown root:wheel "$GITHUB_WORKSPACE/work-data/test1/texte.txt"
          sudo chmod 600 "$GITHUB_WORKSPACE/work-data/test1/texte.txt"
      
          ls -l "$GITHUB_WORKSPACE/work-data/test1/texte.txt"

      - name: Exécuter le script
        run: |
          chmod +x "$GITHUB_WORKSPACE/test.sh"

          "$GITHUB_WORKSPACE/test.sh" \
            "$GITHUB_WORKSPACE/work-data"


      - name: Calculer les hashes APRES
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/work-data"

          find . -type f -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 \
            > "$GITHUB_WORKSPACE/after.sha256"

          cat "$GITHUB_WORKSPACE/after.sha256"


      - name: Comparer avant et après
        if: always()
        run: |
          diff -u \
            "$GITHUB_WORKSPACE/before.sha256" \
            "$GITHUB_WORKSPACE/after.sha256" \
            || true


      - name: Vérifier intégrité après script
        if: always()
        run: |
          source "$GITHUB_WORKSPACE/validator-env/bin/activate"

          python3 "$GITHUB_WORKSPACE/check_integrity.py" \
            "$GITHUB_WORKSPACE/work-data"


      - name: Sauvegarder les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fichiers-apres-test
          path: |
            work-data/
            before.sha256
            after.sha256
          retention-days: 1
